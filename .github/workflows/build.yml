name: Build Windows EXE

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        arch: [x64]
        build_type: [MinSizeRel]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Configure CMake
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A ${{ matrix.arch }} `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DUSE_STATIC_CRT=ON `
            -DENABLE_LTO=ON `
            -DENABLE_AES=ON `
            -DENABLE_SFX=ON `
            -DENABLE_SHELL_EXTENSION=ON `
            -DENABLE_TESTS=OFF

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Copy resources
        run: |
          mkdir -p build/${{ matrix.build_type }}/skins
          mkdir -p build/${{ matrix.build_type }}/icons
          xcopy /E /I /Y res\skins build\${{ matrix.build_type }}\skins
          xcopy /E /I /Y res\icons build\${{ matrix.build_type }}\icons

      - name: Check size
        run: python scripts/check_size.py build/${{ matrix.build_type }}

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: AceZip-${{ matrix.arch }}-${{ matrix.build_type }}
          path: |
            build/${{ matrix.build_type }}/*.exe
            build/${{ matrix.build_type }}/*.dll
            build/${{ matrix.build_type }}/skins/
            build/${{ matrix.build_type }}/icons/
          retention-days: 90
