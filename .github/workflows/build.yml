name: Build Windows EXE

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        arch: [x64]
        build_type: [MinSizeRel]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Configure CMake
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A ${{ matrix.arch }} `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DUSE_STATIC_CRT=ON `
            -DENABLE_LTO=OFF `
            -DENABLE_AES=OFF `
            -DENABLE_SFX=OFF `
            -DENABLE_SHELL_EXTENSION=OFF `
            -DENABLE_TESTS=OFF

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: List build output
        run: dir /s /b build\bin\*.exe build\bin\*.dll 2>nul || echo "No exe found"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: AceZip-${{ matrix.arch }}-${{ matrix.build_type }}
          path: |
            build/bin/*.exe
            build/bin/*.dll
            build/bin/skins/
            build/bin/icons/
          retention-days: 90
          if-no-files-found: warn
